<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PayLens — AI Business Analyst for Payments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">
      <!-- Upward arrowhead over a square void: the shape language of Pine Labs'
           2022 identity, drawn here rather than using their actual logo file. -->
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16 3 L29 19 H21.5 L16 11.5 L10.5 19 H3 Z" fill="#50D387"/>
        <rect x="11.5" y="22" width="9" height="7" rx="1.5" fill="#50D387" opacity=".45"/>
      </svg>
      <div>
        <b>PayLens</b>
        <span>AI Business Analyst</span>
      </div>
    </div>

    <div class="ctl">
      <label for="role">Role</label>
      <select id="role" aria-label="Access role"></select>
    </div>
    <div class="ctl" id="claimwrap" hidden>
      <label for="claim">Scope</label>
      <select id="claim" aria-label="Scope claim"></select>
    </div>
    <button class="iconbtn" id="theme" title="Toggle light / dark" aria-label="Toggle theme">◐</button>
  </div>
</header>

<main>
<div class="layout">
  <!-- ─────────── left column ─────────── -->
  <div>
    <section class="panel">
      <div class="panel-h"><h3>Ask</h3></div>
      <div class="panel-b">
        <div class="askwrap">
          <textarea id="q" placeholder="Why did our overall success rate drop last week?"
                    aria-label="Your question"></textarea>
        </div>
        <div class="askrow">
          <button class="primary" id="go">Analyse</button>
          <button class="ghost" id="clear">Clear</button>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-h"><h3>Try these</h3></div>
      <div class="panel-b"><div class="sugg" id="sugg"></div></div>
    </section>

    <section class="panel">
      <div class="panel-h"><h3>What I can read</h3></div>
      <div class="panel-b" id="meta"><div class="empty">loading…</div></div>
    </section>
  </div>

  <!-- ─────────── right column ─────────── -->
  <div>
    <section class="panel" id="answer">
      <div class="panel-b">
        <div class="empty">
          Ask a question about payment performance.<br>
          Every answer shows the query it ran, the data it used and what it cannot prove.
        </div>
      </div>
    </section>
  </div>
</div>
</main>

<div class="tip" id="tip" role="status" aria-live="polite"></div>
<script src="charts.js"></script>
<script src="app.js"></script>
</body>
</html>
