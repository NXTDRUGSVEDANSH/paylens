services:
  - type: web
    name: paylens
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && python data/generate.py"
    startCommand: "uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
